name: Build Debug APK

on:
  push:
    branches:
      - claude/android-dev-setup-AVtqY
      - claude/add-iterative-functionality-3xE0w
      - main
    paths-ignore:
      - 'build-logs/**'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Compute version metadata (early)
        id: meta
        run: |
          CODE=$(git rev-list --count HEAD)
          NAME="1.0.${CODE}"
          SHA=$(git rev-parse --short HEAD)
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "Will build versionCode=$CODE versionName=$NAME sha=$SHA"

      - name: Build debug APK
        id: build
        continue-on-error: true
        env:
          APP_VERSION_CODE: ${{ steps.meta.outputs.code }}
          APP_VERSION_NAME: ${{ steps.meta.outputs.name }}
          APP_GIT_SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -o pipefail
          gradle assembleDebug \
            -PappVersionCode=${{ steps.meta.outputs.code }} \
            -PappVersionName=${{ steps.meta.outputs.name }} \
            -PappGitSha=${{ steps.meta.outputs.sha }} \
            --no-daemon --stacktrace --info 2>&1 | tee build.log
          echo "exit=$?" > build.exit

      - name: Show build log inline
        if: always()
        run: |
          echo "::group::build.log tail (last 200 lines)"
          tail -n 200 build.log || echo "no build.log"
          echo "::endgroup::"
          ls -la build*.log build.exit 2>/dev/null || true
          echo "WORKSPACE=$GITHUB_WORKSPACE"
          pwd

      - name: Upload full build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: |
            build.log
            build.exit
          if-no-files-found: warn

      - name: Commit build log to build-logs branch
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          SHA=$(git rev-parse HEAD)
          SHORT=$(git rev-parse --short HEAD)
          STATUS="${{ steps.build.outcome }}"

          # Stash the build log and exit status before switching branches
          mkdir -p /tmp/log-stash
          cp build.log /tmp/log-stash/build.log 2>/dev/null || echo "no build.log" > /tmp/log-stash/build.log
          cp build.exit /tmp/log-stash/build.exit 2>/dev/null || echo "exit=?" > /tmp/log-stash/build.exit

          git stash -u 2>/dev/null || true

          # Fetch / create orphan build-logs branch
          if git ls-remote --exit-code --heads origin build-logs >/dev/null 2>&1; then
            git fetch origin build-logs:build-logs
            git checkout build-logs
          else
            git checkout --orphan build-logs
            git rm -rf . 2>/dev/null || true
            echo "# Build logs branch" > README.md
            git add README.md
            git commit -m "Init build-logs branch [skip ci]" || true
          fi

          mkdir -p runs
          cp /tmp/log-stash/build.log "runs/${SHORT}.log"
          cp /tmp/log-stash/build.exit "runs/${SHORT}.exit"
          echo "${STATUS}" > "runs/${SHORT}.status"
          # Maintain a "latest" pointer
          cp /tmp/log-stash/build.log runs/latest.log
          cp /tmp/log-stash/build.exit runs/latest.exit
          echo "${STATUS}" > runs/latest.status
          echo "${SHA}" > runs/latest.sha

          git add runs/
          git commit -m "Build log ${SHORT} (${STATUS}) [skip ci]" || echo "nothing to commit"
          git push origin build-logs

      - name: Open issue with build log on failure
        if: steps.build.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'No log captured.';
            try {
              const log = fs.readFileSync('build.log', 'utf8');
              const tail = log.length > 50000 ? log.slice(-50000) : log;
              body = '```\n' + tail + '\n```';
            } catch (e) {
              body = 'Failed to read build.log: ' + String(e);
            }
            const sha = context.sha.substring(0, 7);
            try {
              const result = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Build failure for ${sha}`,
                body: `Build failure for commit ${context.sha}\n\nLog also at: build-logs branch \`runs/${sha}.log\` and \`runs/latest.log\`.\n\nLast ~50KB:\n\n${body}`
              });
              core.notice(`Created issue #${result.data.number}`);
            } catch (err) {
              core.error('Issue creation failed: ' + (err.message || String(err)));
              core.error(JSON.stringify(err.response?.data || {}));
            }

      - name: Stage release assets
        if: steps.build.outcome == 'success'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TestApp.apk
          cat > version.json <<EOF
          {
            "versionCode": ${{ steps.meta.outputs.code }},
            "versionName": "${{ steps.meta.outputs.name }}",
            "sha": "${{ steps.meta.outputs.sha }}",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/latest-debug/TestApp.apk",
            "notes": "Auto build ${{ steps.meta.outputs.sha }}"
          }
          EOF
          cat version.json

      - name: Publish to GitHub Release (latest-debug)
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: Latest Debug Build
          body: |
            Debug APK built automatically from the latest push.
            Version: ${{ steps.meta.outputs.name }} (code ${{ steps.meta.outputs.code }})
            Commit: ${{ steps.meta.outputs.sha }}

            Direct download (no login required):
            https://github.com/${{ github.repository }}/releases/download/latest-debug/TestApp.apk
          files: |
            TestApp.apk
            version.json
          prerelease: true
          make_latest: "false"

      - name: Fail the job if build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::Gradle build failed - see build-logs branch and issues"
          exit 1

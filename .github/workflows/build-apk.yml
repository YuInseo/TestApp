name: Build Debug APK

on:
  push:
    branches:
      - claude/android-dev-setup-AVtqY
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        id: build
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Capture build log on failure
        if: failure()
        run: |
          tail -c 100000 build.log > build-tail.log || true
          ls -la build*.log || true

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build*.log

      - name: Publish build log to release on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: Latest Debug Build
          body: |
            BUILD FAILED for ${{ github.sha }}.
            See build-tail.log attached for last ~100KB of log output.
          files: build-tail.log
          prerelease: true
          make_latest: "false"

      - name: Compute version metadata
        id: meta
        run: |
          CODE=$(git rev-list --count HEAD)
          NAME="1.0.${CODE}"
          SHA=$(git rev-parse --short HEAD)
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Stage release assets
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TestApp.apk
          cat > version.json <<EOF
          {
            "versionCode": ${{ steps.meta.outputs.code }},
            "versionName": "${{ steps.meta.outputs.name }}",
            "sha": "${{ steps.meta.outputs.sha }}",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/latest-debug/TestApp.apk",
            "notes": "Auto build ${{ steps.meta.outputs.sha }}"
          }
          EOF
          cat version.json

      - name: Publish to GitHub Release (latest-debug)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: Latest Debug Build
          body: |
            Debug APK built automatically from the latest push.
            Version: ${{ steps.meta.outputs.name }} (code ${{ steps.meta.outputs.code }})
            Commit: ${{ steps.meta.outputs.sha }}

            Direct download (no login required):
            https://github.com/${{ github.repository }}/releases/download/latest-debug/TestApp.apk
          files: |
            TestApp.apk
            version.json
          prerelease: true
          make_latest: "false"

      - name: Upload APK artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: TestApp-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

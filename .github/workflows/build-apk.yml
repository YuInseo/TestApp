name: Build Debug APK

on:
  push:
    branches:
      - claude/android-dev-setup-AVtqY
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TestApp.apk

      - name: Publish to GitHub Release (latest-debug)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: Latest Debug Build
          body: |
            Debug APK built automatically from the latest push.
            Direct download (no login required):
            https://github.com/${{ github.repository }}/releases/download/latest-debug/TestApp.apk
          files: TestApp.apk
          prerelease: true
          make_latest: "false"

      - name: Upload APK artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: TestApp-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
